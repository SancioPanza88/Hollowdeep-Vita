@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0810}}
:root[data-theme="dark"]{--bg:#0b0810}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Press Start 2P',ui-monospace,monospace;user-select:none;-webkit-user-select:none}
#wrap{position:relative;container-type:inline-size;max-width:100%}
canvas{display:block;cursor:none;image-rendering:pixelated;touch-action:none;background:#000}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;background:radial-gradient(ellipse at 50% 40%,rgba(14,9,20,.30) 0%,rgba(7,4,11,.80) 60%,rgba(3,2,6,.97) 100%);text-align:center;padding:1.6cqw;overflow:hidden}
#ov.h{display:none}
#ov::before{content:'';position:absolute;inset:-25%;background:radial-gradient(circle at 18% 82%,rgba(120,14,22,.17),transparent 46%),radial-gradient(circle at 82% 18%,rgba(224,164,58,.08),transparent 42%);animation:fog 15s ease-in-out infinite alternate;pointer-events:none;z-index:0}
#ov::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);pointer-events:none;z-index:3;opacity:.65}
@keyframes fog{to{transform:translate3d(2%,-1.5%,0) scale(1.08)}}
#ov>*{position:relative;z-index:2}
#ov>.fx{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.fx i{position:absolute;bottom:-2%;width:var(--s);height:var(--s);border-radius:50%;background:var(--c,#ffb347);box-shadow:0 0 .7cqw var(--c,#ff6a00);opacity:0;animation:ember var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes ember{0%{transform:translate3d(0,0,0) scale(.3);opacity:0}12%{opacity:.85}70%{opacity:.28}100%{transform:translate3d(var(--dx),-88cqw,0) scale(1.05);opacity:0}}
.logo{font-size:8.6cqw;line-height:1.05;background:linear-gradient(100deg,#fff3cc 0%,#ffc857 36%,#b94a12 52%,#ffd98a 68%,#fff3cc 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .5cqw 0 #2a0d02) drop-shadow(0 0 2cqw rgba(255,140,40,.45));animation:fl 3.4s ease-in-out infinite,shine 9s linear infinite;letter-spacing:.35cqw}
@keyframes fl{50%{filter:drop-shadow(0 .5cqw 0 #2a0d02) drop-shadow(0 0 3.6cqw rgba(255,160,40,.85))}}
@keyframes shine{to{background-position:-240% 0}}
.h2{font-size:3.4cqw;color:var(--ac2);text-shadow:.35cqw .35cqw 0 #3a1604}
.sub{font-size:1.05cqw;color:#b9a9c9;letter-spacing:.5cqw;text-transform:uppercase}
.tx{font-size:1.15cqw;line-height:2.05;max-width:86cqw}
.dim{color:var(--dim)}.ac{color:var(--ac)}
.foot{font-size:.95cqw;color:var(--dim);margin-top:.7cqw;line-height:1.9}
.foot a{color:var(--ac2);text-decoration:none;border-bottom:.12cqw dotted rgba(255,217,138,.55)}
.foot a:hover{color:#fff;border-bottom-color:#fff}
.mbs{display:flex;flex-direction:column;gap:.75cqw;align-items:center;margin-top:.55cqw}
.mbs.row{flex-direction:row;gap:1.3cqw;flex-wrap:wrap;justify-content:center}
.mb{min-width:27cqw;padding:1cqw 2.1cqw;font-size:1.5cqw;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(8,5,12,.55));border:.26cqw solid rgba(224,164,58,.32);color:var(--fg);cursor:pointer;transition:transform .08s,background .08s,box-shadow .12s,border-color .12s;box-shadow:inset 0 .14cqw 0 rgba(255,255,255,.06),0 .38cqw 0 rgba(0,0,0,.55);letter-spacing:.08cqw;position:relative;text-transform:uppercase}
.mb:hover{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(8,5,12,.6));border-color:rgba(255,217,138,.5)}
.mb:active{transform:translateY(.28cqw);box-shadow:inset 0 .14cqw 0 rgba(255,255,255,.06),0 .1cqw 0 rgba(0,0,0,.55)}
.mbs.row .mb{min-width:0;font-size:1.3cqw;padding:.9cqw 1.6cqw}
.mb.on{background:linear-gradient(180deg,#ffe8a8 0%,#ffc857 36%,#e0a43a 62%,#a8641a 100%);color:#241506;border-color:#fff0c0;transform:translateY(-.12cqw) scale(1.02);box-shadow:0 0 2.4cqw rgba(255,180,60,.45),0 .42cqw 0 #4a2506}
.mb.on::before{content:'>';position:absolute;left:.7cqw;top:50%;transform:translateY(-52%);color:#7a3a08}
.mb.primary{background:linear-gradient(180deg,#9f1a20 0%,#6d0d14 55%,#3a0509 100%);border-color:rgba(255,120,100,.6);box-shadow:0 0 1.8cqw rgba(130,10,18,.32),0 .38cqw 0 rgba(0,0,0,.55);text-shadow:0 .15cqw 0 rgba(0,0,0,.7)}
.mb.primary:hover{background:linear-gradient(180deg,#c1242b,#7d0d14 58%,#4a070c);border-color:#ffb09a}
.mb.primary.on{background:linear-gradient(180deg,#ffd98a,#e0a43a 52%,#9f1a20 100%);color:#241506;border-color:#fff0c0;text-shadow:none}
.cards{display:flex;gap:1cqw;justify-content:center}
.cd{width:12.4cqw;display:flex;flex-direction:column;align-items:center;gap:.5cqw;padding:.8cqw;border:.3cqw solid transparent;background:rgba(255,255,255,.05);cursor:pointer;transition:transform .1s}
.cd.on{border-color:var(--ac);background:rgba(224,164,58,.16);transform:translateY(-.6cqw)}
.cd canvas{width:4.4cqw;height:7.7cqw;cursor:pointer;background:none}
.cd b{font-size:1.05cqw;font-weight:normal}
.st{display:flex;align-items:center;gap:.5cqw;width:100%;font-size:.8cqw;color:var(--dim)}
.st span{width:3cqw;text-align:left}
.bar{flex:1;height:.7cqw;background:#2a2238}
.bar i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:auto auto;gap:.7cqw 2.4cqw;text-align:left;font-size:1.2cqw}
.grid b{font-weight:normal;color:var(--ac2)}
.k{display:inline-block;font-weight:normal;border:.2cqw solid var(--ac);padding:.2cqw .5cqw;color:var(--ac2);margin:0 .2cqw}
.hw{display:grid;grid-template-columns:repeat(3,1fr);gap:.8cqw;width:94cqw}
.hc{display:flex;gap:.8cqw;align-items:center;background:rgba(255,255,255,.05);border:.25cqw solid rgba(224,164,58,.25);padding:.6cqw;text-align:left}
.hc canvas{width:12.4cqw;height:7.75cqw;image-rendering:pixelated;background:#15101d;flex:none;cursor:default}
.ht{font-size:1cqw;color:var(--ac2);margin-bottom:.45cqw}
.hd{font-size:.8cqw;line-height:1.85;color:var(--fg)}
.slots{display:flex;gap:.9cqw;justify-content:center}
.sl{width:13cqw;padding:.7cqw;border:.25cqw solid #3a2d4a;font-size:.95cqw;line-height:1.7;background:rgba(255,255,255,.04);color:var(--dim)}
.sl.me{border-color:var(--ac)}
.big{font-size:3cqw;letter-spacing:.8cqw;color:var(--ac2);text-shadow:.3cqw .3cqw 0 #3a1604}
#code{font:inherit;font-size:3cqw;text-align:center;width:22cqw;padding:.9cqw;background:#150f1e;border:.3cqw solid var(--ac);color:var(--ac2);text-transform:uppercase;letter-spacing:.6cqw;outline:none}
button{font:inherit}
.menuMeta{display:flex;gap:1.1cqw;flex-wrap:wrap;justify-content:center;align-items:center}
.menuMeta span{font-size:.9cqw;color:var(--dim);border:.18cqw solid rgba(224,164,58,.22);background:rgba(0,0,0,.28);padding:.45cqw .75cqw;letter-spacing:.06cqw}
.menuMeta b{color:var(--ac2);font-weight:normal}
.warnline{font-size:.82cqw;color:#d87867;letter-spacing:.22cqw;margin-top:.1cqw}
.quote{font-size:1.3cqw;color:var(--ac2);line-height:2;max-width:72cqw;margin:.2cqw auto}
.disc{width:70cqw;max-width:92%;display:flex;flex-direction:column;gap:.9cqw;align-items:center}
.discBox{width:100%;padding:1.1cqw 1.4cqw;border:.25cqw solid rgba(216,120,103,.5);background:rgba(90,8,12,.26);color:#ffd7cc;font-size:1.05cqw;line-height:2.05}
.discBox b{color:#ffb09a}

/* ================= HOLLOWDEEP: THE LANTERN BELOW ================= */
#cine{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden;cursor:pointer;font-family:'Press Start 2P',ui-monospace,monospace}
#cine.h{display:none}
#cc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.cTop{position:absolute;top:1.1cqw;right:1.4cqw;z-index:5;display:flex;align-items:center;gap:1cqw}
.cSkip{font-size:max(10px,.8cqw);color:#b9a9c9;border:.16cqw solid rgba(224,164,58,.28);background:rgba(0,0,0,.45);padding:.42cqw .7cqw;cursor:pointer;letter-spacing:.1cqw}
.cSkip:hover{color:#ffd98a;border-color:rgba(255,217,138,.7)}
.cSkip.dim{opacity:.35;cursor:default}
.cCap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;pointer-events:none;text-align:center;padding:0 6cqw;opacity:0;transition:opacity .6s}
.cCap.show{opacity:1}
.cCapK{font-size:1.15cqw;letter-spacing:.9cqw;color:#e0a43a;text-shadow:0 .3cqw 0 #2a0d02;margin-bottom:1.1cqw}
.cCapT{font-size:4.2cqw;line-height:1.35;letter-spacing:.45cqw;color:#f2e6c9;text-shadow:0 .45cqw 0 #1a0b02,0 0 3cqw rgba(224,164,58,.45)}
.cCapS{font-size:1.2cqw;line-height:2;letter-spacing:.3cqw;color:#b9a9c9;margin-top:1.4cqw}
.cDlg{position:absolute;left:7cqw;right:7cqw;bottom:3.2cqw;z-index:4;padding:1.35cqw 1.7cqw 1.15cqw;background:linear-gradient(180deg,rgba(12,8,18,.94),rgba(5,3,9,.97));border:.22cqw solid rgba(224,164,58,.42);box-shadow:0 0 2.4cqw rgba(0,0,0,.7),inset 0 0 2cqw rgba(224,164,58,.05);display:none}
.cDlg.show{display:block}
.cWho{font-size:max(11px,.95cqw);letter-spacing:.22cqw;margin-bottom:.72cqw;color:#ffd98a;min-height:1.1cqw}
.cText{font-size:max(12px,1.16cqw);line-height:2.05;color:#f2e6c9;min-height:6.2cqw;white-space:pre-wrap;text-shadow:.1cqw .1cqw 0 #000}
.cChoices{display:flex;flex-direction:column;gap:.5cqw;margin-top:.35cqw}
.cbtn{font:inherit;font-size:max(11px,.98cqw);line-height:1.7;text-align:left;padding:.55cqw .8cqw;background:rgba(255,255,255,.045);border:.16cqw solid rgba(224,164,58,.25);color:#f2e6c9;cursor:pointer;transition:background .1s,border-color .1s,transform .06s;letter-spacing:.04cqw}
.cbtn:hover,.cbtn.on{background:rgba(224,164,58,.17);border-color:rgba(255,217,138,.75);transform:translateX(.25cqw)}
.cbtn .num{color:#e0a43a;margin-right:.55cqw}
.cbtn .hint{display:block;font-size:max(9px,.72cqw);line-height:1.7;color:#8f84a8;margin-top:.2cqw;letter-spacing:.02cqw}
.cbtn.locked{opacity:.42;cursor:not-allowed;border-color:rgba(143,132,168,.2)}
.cbtn.locked:hover{background:rgba(255,255,255,.03);border-color:rgba(143,132,168,.2);transform:none}
.cNext{position:absolute;right:1.2cqw;bottom:.55cqw;color:#e0a43a;font-size:max(11px,1cqw);animation:cnb 1s steps(2) infinite;display:none}
.cNext.show{display:block}
@keyframes cnb{50%{opacity:.15;transform:translateY(.25cqw)}}
.cineFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.cineVig{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 46%,transparent 38%,rgba(0,0,0,.52) 100%),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}

/* story UI */
.storyTag{display:inline-block;font-size:.78cqw;letter-spacing:.2cqw;color:#ffd98a;border:.15cqw solid rgba(224,164,58,.3);padding:.32cqw .6cqw;margin:.15cqw}
.storyMeta{display:flex;gap:.8cqw;flex-wrap:wrap;justify-content:center;margin:.2cqw 0 .4cqw}
.storyMeta span{font-size:max(10px,.95cqw);color:#b9a9c9}
.storyMeta b{color:#ffd98a;font-weight:normal}
.chapterCard{width:78cqw;margin:.2cqw auto;padding:1cqw 1.4cqw;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(8,5,12,.5));border:.2cqw solid rgba(224,164,58,.28);text-align:left}
.chapterCard .ccK{font-size:.75cqw;letter-spacing:.3cqw;color:#e0a43a;margin-bottom:.5cqw}
.chapterCard .ccT{font-size:1.5cqw;color:#ffd98a;margin-bottom:.45cqw;line-height:1.6}
.chapterCard .ccD{font-size:.85cqw;line-height:1.9;color:#d8cde6}
.endRow{display:flex;gap:.6cqw;justify-content:center;flex-wrap:wrap;margin:.4cqw 0}
.endChip{font-size:.75cqw;letter-spacing:.1cqw;padding:.36cqw .6cqw;border:.15cqw solid rgba(224,164,58,.22);color:#6f6582;background:rgba(0,0,0,.25)}
.endChip.got{color:#ffd98a;border-color:rgba(255,217,138,.55)}

/* camp */
#campArt,#epiArt{display:block;width:100%;height:100%;image-rendering:pixelated;background:#08060d}
#epiArt{object-fit:cover;object-position:center bottom}
.campArtWrap{width:92cqw;height:22cqw;margin:0 auto;border:.2cqw solid rgba(224,164,58,.28);overflow:hidden;position:relative;background:#08060d}
.campArtWrap::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 4cqw rgba(0,0,0,.7);pointer-events:none}
.campHead{display:flex;justify-content:space-between;align-items:center;width:92cqw;margin:.3cqw auto 0;font-size:max(10px,.86cqw);color:#b9a9c9}
.campHead b{color:#ffd98a;font-weight:normal}
.campGrid{display:grid;grid-template-columns:1fr 1fr;gap:.65cqw;width:92cqw;margin:.55cqw auto 0}
.campCol{display:flex;flex-direction:column;gap:.5cqw}
.campLbl{font-size:max(9px,.78cqw);letter-spacing:.22cqw;color:#8f84a8;margin-bottom:.1cqw}
.npc,.up{display:flex;justify-content:space-between;align-items:center;gap:.5cqw;padding:.48cqw .65cqw;background:rgba(255,255,255,.045);border:.16cqw solid rgba(224,164,58,.22);cursor:pointer;transition:background .1s,border-color .1s,transform .06s;text-align:left;font:inherit;color:#f2e6c9}
.npc:hover,.up:hover{background:rgba(224,164,58,.14);border-color:rgba(255,217,138,.6);transform:translateX(.2cqw)}
.npc .nn{font-size:max(10px,.9cqw);line-height:1.55;color:#ffd98a}
.npc .ns{font-size:max(9px,.72cqw);line-height:1.5;color:#8f84a8}
.up .un{font-size:max(10px,.84cqw);color:#f2e6c9}
.up .uc{font-size:max(10px,.78cqw);color:#ffd34a;white-space:nowrap}
.up .ns{font-size:max(9px,.72cqw);line-height:1.5;color:#8f84a8}
.up .pips{display:flex;gap:.2cqw;margin-top:.2cqw}
.up .pips i{width:1.5cqw;height:.3cqw;background:#2a2238;display:block}
.up .pips i.on{background:#e0a43a}
.up.max{opacity:.55;cursor:default}
.up.no .uc{color:#ff6b6b}
.up.no:hover{transform:none;border-color:rgba(224,164,58,.22);background:rgba(255,255,255,.045)}

/* journal */
.jrn{width:90cqw;max-height:50cqw;overflow-y:auto;overflow-x:hidden;text-align:left;padding:.3cqw 1cqw .3cqw .3cqw;margin:0 auto}
.jrn::-webkit-scrollbar{width:.8cqw}
.jrn::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
.jrn::-webkit-scrollbar-thumb{background:rgba(224,164,58,.5)}
.jrn h3{font-size:max(13px,1.3cqw);font-weight:normal;color:#ffd98a;letter-spacing:.15cqw;margin:1.35cqw 0 .5cqw;border-bottom:.12cqw solid rgba(224,164,58,.22);padding-bottom:.38cqw}
.jrn h3:first-child{margin-top:0}
.jrEntry{margin-bottom:.9cqw;padding:.78cqw .9cqw;background:rgba(255,255,255,.035);border-left:.2cqw solid rgba(224,164,58,.4)}
.jrEntry b{display:block;font-weight:normal;color:#f2e6c9;font-size:max(13px,1.25cqw);margin-bottom:.4cqw;letter-spacing:.06cqw;line-height:1.7}
.jrEntry span{display:block;font-size:max(12px,1.2cqw);line-height:1.95;color:#cbbdda}
.jrEntry.lock{opacity:.45;border-left-color:#2a2238}
.jrEntry.lock b{color:#6f6582}
.jrIntro{font-size:max(12px,1.1cqw);line-height:1.95;color:#e2d6ee;margin-bottom:.7cqw;text-align:center}
.jrShard{color:#c78bff}
.jrGold{color:#ffd98a}

/* epilogue */
.epiHero{font-size:2.2cqw;letter-spacing:.4cqw;color:#ffd98a;text-shadow:.3cqw .3cqw 0 #2a0d02;line-height:1.5}
.epiSub{font-size:1cqw;color:#b9a9c9;line-height:1.9;margin-top:.4cqw}
.epiStats{display:grid;grid-template-columns:auto auto;gap:.45cqw 2cqw;font-size:.85cqw;line-height:1.8;text-align:left;margin:.7cqw auto}
.epiStats b{color:#ffd98a;font-weight:normal}
.epiStats span{color:#d8cde6}

/* touch pulse */
.touchBtn{position:absolute;pointer-events:none;border:.18cqw solid rgba(255,255,255,.35);border-radius:50%;background:rgba(0,0,0,.18);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.62cqw;letter-spacing:.05cqw}

/* ==================== REDESIGNED MENU ==================== */
.langSwitch{display:flex;gap:.3cqw;align-items:center;background:rgba(8,5,12,.72);border:.14cqw solid rgba(224,164,58,.24);padding:.24cqw;flex:none}
#ov>.langSwitch{position:absolute;top:.75cqw;right:1.05cqw;z-index:9}
.langBtn{display:flex;align-items:center;gap:.32cqw;font:inherit;font-size:max(8px,.6cqw);letter-spacing:.08cqw;color:#b9a9c9;background:transparent;border:.12cqw solid transparent;padding:.2cqw .34cqw;cursor:pointer;line-height:1.2}
.langBtn:hover{color:#fff;background:rgba(255,255,255,.07)}
.langBtn.on{color:#241506;background:linear-gradient(180deg,#ffe8a8,#e0a43a);border-color:#fff0c0}
.langBtn svg{width:1.5cqw;height:1cqw;min-width:15px;min-height:10px;display:block;border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}

.mnShell{width:95cqw;height:64.5cqw;max-height:100%;display:grid;grid-template-columns:1.02fr .98fr;gap:1.1cqw;text-align:left}
.mnBrand{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:1.45cqw 1.5cqw 1.15cqw;background:linear-gradient(160deg,rgba(24,16,32,.9),rgba(8,5,12,.94));border:.15cqw solid rgba(224,164,58,.28);box-shadow:inset 0 0 5cqw rgba(0,0,0,.55),0 1cqw 4cqw rgba(0,0,0,.45);overflow:hidden}
.mnBrand::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 72% 10%,rgba(224,164,58,.16),transparent 55%),radial-gradient(ellipse at 18% 92%,rgba(120,14,22,.22),transparent 55%);pointer-events:none}
.mnBrand>*{position:relative;z-index:1}
.mnKick{font-size:max(9px,.64cqw);letter-spacing:.32cqw;color:#e0a43a;text-transform:uppercase}
.mnLogo{font-size:max(26px,4.1cqw);line-height:1.06;margin:.5cqw 0 .25cqw;background:linear-gradient(100deg,#fff3cc,#ffc857 38%,#b94a12 54%,#ffd98a 70%,#fff3cc);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .28cqw 0 #2a0d02) drop-shadow(0 0 1.2cqw rgba(255,140,40,.35));letter-spacing:.16cqw;animation:shine 9s linear infinite}
.mnSub{font-size:max(10px,.78cqw);letter-spacing:.34cqw;color:#ffd98a;line-height:1.7}
.mnRule{height:.1cqw;background:linear-gradient(90deg,rgba(224,164,58,.7),rgba(224,164,58,0));margin:.95cqw 0}
.mnCardK{font-size:max(8px,.62cqw);letter-spacing:.22cqw;color:#8f84a8;text-transform:uppercase;line-height:1.7}
.mnCardT{font-size:max(13px,1.28cqw);line-height:1.65;color:#ffd98a;margin:.42cqw 0 .38cqw}
.mnCardD{font-size:max(10px,.74cqw);line-height:1.95;color:#cfc2df}
.mnProgress{display:grid;grid-template-columns:repeat(3,1fr);gap:.4cqw;margin-top:.9cqw}

  1: { name: 'WHAT THE MUD KEEPS', start: 1, end: 3, bossFloor: 3, boss: 'THE GRAVEKEEPER', intro: 'intro', outro: 'ch1_outro', next: 2 },
  2: { name: 'THE ROTTING SAINT', start: 4, end: 6, bossFloor: 6, boss: 'THE ROTTING SAINT', intro: 'ch2_intro', outro: 'ch2_outro', next: 3 },
  3: { name: 'THE EMBER CROWN', start: 7, end: 10, bossFloor: 10, boss: 'THE HOLLOW KING', intro: 'ch3_intro', outro: null, next: null }
};

const HD_UPGRADES = {
  vit:   { name: 'VITALITY',  desc: '+1 heart',         costs: [25, 45] },
  edge:  { name: 'EDGE',      desc: '+1 damage',        costs: [30, 55] },
  swift: { name: 'SWIFTNESS', desc: 'speed & recovery', costs: [25, 45] },
  lamp:  { name: 'LANTERN',   desc: 'stronger pulse',   costs: [30, 50] }
};

const HD_EVENTS = {
  1: { id: 'whisper', scene: 'ev_whisper', title: 'THE WHISPERING DOOR' },
  2: { id: 'puzzle', title: 'THE SEALED MEMORY' },
  4: { id: 'orin', scene: 'ev_orin', title: 'THE RESIN SCHOLAR' },
  5: { id: 'arena', title: 'HOLD THE LIGHT' },
  7: { id: 'witch', scene: 'ev_witch', title: 'THE EMBER WITCH' },
  8: { id: 'chase', title: 'THE COLLAPSE' },
  9: { id: 'mirror', scene: 'ev_mirror', title: 'THE MIRROR OF VEYRA' }
};

/* ------------------------------ state ------------------------------ */
function hdDefaultStory() {
  return {
    v: HD_VERSION, active: false, started: false, completed: false, cycle: 1,
    chapter: 1, floor: 1, checkpoint: { chapter: 1, floor: 1 },
    atCamp: false, campChapter: 1,
    hero: { h: 0, g: 'm' },
    flags: { trust: 0 },
    embers: 0,
    upgrades: { vit: 0, edge: 0, swift: 0, lamp: 0 },
    bonus: { hp: 0, dmg: 0 },
    shards: 0,
    lore: {}, people: {}, bestiary: {}, done: {}, seenBoss: {}, seenScenes: {},
    endings: {}, deaths: 0, kills: 0, startedAt: Date.now(), ending: null
  };
}

let STORY = hdDefaultStory();
let HD_BOSS_MOD = null;

function hdMergeStory(s) {
  const d = hdDefaultStory();
  if (!s || typeof s !== 'object') return d;
  const out = Object.assign(d, s);
  for (const k of ['flags', 'upgrades', 'bonus', 'lore', 'people', 'bestiary', 'done', 'seenBoss', 'seenScenes', 'endings', 'checkpoint']) {
    out[k] = Object.assign({}, d[k] || {}, s[k] || {});
  }
  out.hero = Object.assign({ h: 0, g: 'm' }, s.hero || {});
  out.chapter = Math.max(1, Math.min(3, +s.chapter || 1));
  out.floor = Math.max(1, Math.min(10, +s.floor || 1));
  out.checkpoint.chapter = Math.max(1, Math.min(3, +out.checkpoint.chapter || 1));
  out.checkpoint.floor = Math.max(1, Math.min(10, +out.checkpoint.floor || 1));
  return out;
}

function hdLoadStory() {
  try {
    const raw = localStorage.getItem(HD_SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.v) return null;
    return hdMergeStory(s);
  } catch (e) { return null; }
}

function hdSaveStory() {
  try {
    STORY.active = true;
    localStorage.setItem(HD_SAVE_KEY, JSON.stringify(STORY));
  } catch (e) {}
}

function hdClearStory() {
  try { localStorage.removeItem(HD_SAVE_KEY); } catch (e) {}
}

function hdNewStoryState(keepGallery) {
  const old = STORY || {};
  const gallery = keepGallery ? (old.endings || {}) : {};
  const cycle = keepGallery ? ((old.cycle || 1) + 1) : 1;
  STORY = hdDefaultStory();
  STORY.endings = Object.assign({}, gallery);
  STORY.cycle = cycle;
}

const hdOn = () => !!STORY.active;
const hdChapter = () => CHAPTERS[STORY.chapter] || CHAPTERS[1];
const hdIsBossFloor = f => !!(hdChapter().bossFloor === +f);
const hdEventForFloor = f => HD_EVENTS[+f] || null;
const hdFlag = k => !!(STORY.flags && STORY.flags[k]);
const hdSetFlag = (k, v) => { STORY.flags[k] = v === undefined ? true : v; hdSaveStory(); };
const hdAddTrust = n => { STORY.flags.trust = (STORY.flags.trust || 0) + n; };
const hdLore = id => { if (id) STORY.lore[id] = true; };
const hdPeople = id => { if (id) STORY.people[id] = true; };
const hdBest = id => { if (id) STORY.bestiary[id] = true; };
const hdEmbers = n => { STORY.embers = Math.max(0, (STORY.embers || 0) + n); };
const hdShard = () => { STORY.shards = Math.min(3, (STORY.shards || 0) + 1); hdSaveStory(); };
const hdHealHero = n => { if (ME && !ME.down) ME.hp = Math.min(ME.maxHp, ME.hp + n); };
const hdHurtHero = n => { if (ME && !ME.down) { ME.hp = Math.max(1, ME.hp - n); ME.inv = Math.max(ME.inv, 1.1); } };
const hdPermanentHp = n => { STORY.bonus.hp = (STORY.bonus.hp || 0) + n; if (ME) { ME.maxHp += n * 2; ME.hp += n * 2; } hdSaveStory(); };
const hdPermanentDmg = n => { STORY.bonus.dmg = (STORY.bonus.dmg || 0) + n; if (ME) ME.db += n; hdSaveStory(); };

const hdDawnReady = () => (STORY.flags.trust || 0) >= 2 && hdFlag('sparedGK') && hdFlag('orin') && !hdFlag('branded') && hdFlag('sawTruth') && STORY.shards >= 3;
const hdSecretReady = () => hdFlag('sawTruth') && hdFlag('orin') && STORY.shards >= 3;

function hdEndingCount() { return Object.keys(STORY.endings || {}).length; }

/* --------------------------- story helpers -------------------------- */
function hdHeroKey() {
  const h = Math.max(0, Math.min(CL.length - 1, (STORY.hero && STORY.hero.h) | 0));
  const g = STORY.hero && STORY.hero.g === 'f' ? 'f' : 'm';
  return CL[h].spr + '_' + g;
}

function hdHeroName() {
  return CL[Math.max(0, Math.min(CL.length - 1, (STORY.hero && STORY.hero.h) | 0))].n;
}

function hdSaveCheckpoint(chapter, floor) {
  STORY.chapter = chapter;
  STORY.checkpoint = { chapter: chapter, floor: floor };
  hdSaveStory();
}

function hdApplyBonuses() {
  if (!ME) return;
  const u = STORY.upgrades || {};
  const b = STORY.bonus || {};
  const extra = (b.hp || 0) + (u.vit || 0) + (hdFlag('branded') ? 1 : 0);
  ME.maxHp = ME.cls.hp + extra * 2;
  ME.hp = ME.maxHp;
  ME.db = (u.edge || 0) + (b.dmg || 0) + (hdFlag('branded') ? 1 : 0);
  ME.spd = ME.cls.spd * (1 + (u.swift || 0) * 0.055);
  ME.cdm = Math.max(0.5, 1 - (u.swift || 0) * 0.045);
  STORY.light = 100;
  STORY.lightMax = 100;
}

/* ------------------------------ audio ------------------------------ */
function hdSfx(kind) {
  try {
    if (kind === 'bell') { play(880, .5, 'sine', .045, 120); play(1320, .6, 'triangle', .02, 80); }
    else if (kind === 'dark') { play(70, .7, 'sawtooth', .055, -25); }
    else if (kind === 'choice') { play(620, .07, 'triangle', .028, 140); }
    else if (kind === 'step') { play(440, .05, 'triangle', .02, 80); }
    else if (kind === 'wrong') { play(130, .2, 'sawtooth', .05, -50); }
    else if (kind === 'pulse') { play(180, .4, 'sine', .075, 620); play(90, .5, 'triangle', .04, 200); }
    else if (kind === 'shard') { play(1040, .3, 'sine', .05, 400); play(1560, .55, 'triangle', .025, -160); }
    else if (kind === 'camp') { play(330, .2, 'triangle', .03, 110); }
  } catch (e) {}
}

/* =====================================================================
   CUTSCENE THEATER
   ===================================================================== */
const CINE = {
  active: false, id: '', lines: [], idx: 0, labels: {}, bg: 'void', actors: [], fx: '',
  t: 0, parts: [], typing: false, full: '', shown: 0, revealT: 0,
  choice: null, choiceSel: 0, capT: 0, capAuto: 0, capOn: false,
  prevMode: 'menu', ovWasOpen: false, onDone: null, nextScene: null,
  skipOk: true, flash: 0, shake: 0, last: 0
};

const cEl = id => document.getElementById(id);

function hdSceneDef(def) {
  if (!def) return null;
  return Array.isArray(def) ? { lines: def } : def;
}

function hdPlayScene(id, onDone) {
  const def = hdSceneDef(SCENES[id]);
  if (!def) { try { console.warn('[story] missing scene', id); } catch (e) {} if (onDone) onDone(); return; }
  netClose();
  CINE.active = true;
  CINE.id = id;
  CINE.lines = def.lines;
  CINE.idx = 0;
  CINE.labels = {};
  def.lines.forEach((e, i) => { if (e && e.label) CINE.labels[e.label] = i; });
  CINE.bg = def.bg || 'void';
  CINE.actors = def.actors ? def.actors.slice() : [];
  CINE.fx = def.fx || 'dust';
  CINE.t = 0;
  CINE.parts = [];
  CINE.choice = null;
  CINE.choiceSel = 0;
  CINE.capOn = false;
  CINE.capT = 0;
  CINE.capAuto = 0;
  CINE.typing = false;
  CINE.onDone = onDone || null;
  CINE.nextScene = def.next || null;
  CINE.skipOk = def.skip !== false && !def.lines.some(e => e && e.choice);
  CINE.prevMode = (mode === 'play') ? 'play' : 'menu';
  CINE.ovWasOpen = !ov.classList.contains('h');
  CINE.last = 0;
  CINE.flash = 0;
  if (CINE.prevMode === 'play') mode = 'menu';
  ov.classList.add('h');
  cEl('cine').classList.remove('h');
  cEl('cDlg').classList.remove('show');
  cEl('cCap').classList.remove('show');
  cEl('cSkip').classList.toggle('dim', !CINE.skipOk);
  hdCineEnter(0);
}

function hdCineEnter(i) {
  let guard = 0;
  while (guard++ < 400) {
    if (i >= CINE.lines.length) { hdCineFinish(); return; }
    const e = CINE.lines[i];
    if (!e) { i++; continue; }
    if (e.if && !e.if()) { i++; continue; }
    if (e.label) { CINE.labels[e.label] = i; i++; continue; }
    if (e.jump !== undefined) {
      const j = CINE.labels[e.jump];
      i = (j === undefined) ? i + 1 : j;
      continue;
    }
    if (e.bg) CINE.bg = e.bg;
    if (e.actors) CINE.actors = e.actors.slice();
    if (e.fx !== undefined) { CINE.fx = e.fx; CINE.parts = []; }
    if (e.flash) CINE.flash = Math.max(CINE.flash, e.flash);
    if (e.shake) CINE.shake = Math.max(CINE.shake, e.shake);
    if (e.sfx) hdSfx(e.sfx);
    if (e.do) { try { e.do(); } catch (err) { console.warn(err); } }

    if (e.cap !== undefined) {
      hdShowCap(e);
      CINE.idx = i + 1;
      return;
    }
    if (e.choice && e.choice.length) {
      hdShowChoices(e.choice, i);
      return;
    }
    if (e.text !== undefined && e.text !== null) {
      hdShowLine(e, i);
      return;
    }
    i++;
  }
  hdCineFinish();
}

function hdShowCap(e) {
  CINE.capOn = true;
  CINE.capT = 0;
  CINE.capAuto = e.auto || 0;
  CINE.typing = false;
  CINE.choice = null;
  const cap = cEl('cCap');
  cap.querySelector('.cCapK').textContent = e.kicker || '';
  cap.querySelector('.cCapT').textContent = e.cap || '';
  cap.querySelector('.cCapS').textContent = e.sub || '';
  cap.classList.add('show');
  cEl('cDlg').classList.remove('show');
  cEl('cChoices').innerHTML = '';
  hdSfx('bell');
}

function hdShowLine(e, i) {
  CINE.capOn = false;
  CINE.capAuto = 0;
  cEl('cCap').classList.remove('show');
  CINE.idx = i + 1;
  CINE.full = String(e.text || '');
  CINE.shown = 0;
  CINE.typing = true;
  CINE.revealT = 0;
  CINE.choice = null;
  hdSpeaker(e.who, e.color);
  cEl('cDlg').classList.add('show');
  cEl('cChoices').innerHTML = '';
  cEl('cText').textContent = '';
  cEl('cNext').classList.remove('show');
  hdSfx('step');
}

const HD_SPEAKERS = {
  MARA: '#9fd3ff', ORIN: '#ffd98a', GRAVEKEEPER: '#c7a17a', 'THE GRAVEKEEPER': '#c7a17a',
  'EMBER WITCH': '#ff8a6b', AUREL: '#c78bff', 'THE HOLLOW KING': '#c78bff',
  'THE SAINT': '#9ee6ae', 'THE DOOR': '#d87867', NARRATOR: '#8f84a8', YOU: '#f2e6c9'
};

function hdSpeaker(who, color) {
  const w = cEl('cWho');
  if (!who || who === 'NARRATOR') {
    w.textContent = who === 'NARRATOR' ? '— — —' : '';
    w.style.color = '#8f84a8';
  } else {
    w.textContent = (typeof hdTr === 'function') ? hdTr(who) : who;
    w.style.color = color || HD_SPEAKERS[who] || '#ffd98a';
  }
}

function hdShowChoices(opts, i) {
  CINE.capOn = false;
  cEl('cCap').classList.remove('show');
  CINE.idx = i + 1;
  CINE.typing = false;
  CINE.choice = opts;
  CINE.choiceSel = 0;
  cEl('cDlg').classList.add('show');
  cEl('cNext').classList.remove('show');
  const box = cEl('cChoices');
  box.innerHTML = '';
  opts.forEach((o, j) => {
    const locked = typeof o.locked === 'function' ? !!o.locked() : !!o.locked;
    const b = document.createElement('button');
    b.className = 'cbtn' + (locked ? ' locked' : '') + (j === 0 ? ' on' : '');
    b.type = 'button';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(j + 1) + '.';
    b.appendChild(num);
    b.appendChild(document.createTextNode(o.t || '...'));
    if (o.hint) {
      const h = document.createElement('span');
      h.className = 'hint';
      h.textContent = o.hint;
      b.appendChild(h);
    }
    if (typeof o.locked === 'function' && locked && o.lockHint) {
      const h2 = document.createElement('span');
      h2.className = 'hint';
      h2.textContent = o.lockHint;
      b.appendChild(h2);
    }
    b.addEventListener('click', ev => { ev.stopPropagation(); if (!locked) hdChoose(j); });
    box.appendChild(b);
  });
  hdSfx('choice');
}

function hdChoose(j) {
  const opts = CINE.choice;
  if (!opts || !opts[j]) return;
  const o = opts[j];
  const locked = typeof o.locked === 'function' ? !!o.locked() : !!o.locked;
  if (locked) { hdSfx('wrong'); return; }
  CINE.choice = null;
  cEl('cChoices').innerHTML = '';
  hdSfx('choice');
  try {
    if (o.do) o.do();
    if (o.set) for (const k in o.set) STORY.flags[k] = o.set[k];
    if (o.trust) hdAddTrust(o.trust);
    if (o.embers) hdEmbers(o.embers);
    if (o.lore) (Array.isArray(o.lore) ? o.lore : [o.lore]).forEach(hdLore);
    if (o.people) (Array.isArray(o.people) ? o.people : [o.people]).forEach(hdPeople);
    if (o.shard) hdShard();
    if (o.bonus) {
      if (o.bonus.hp) hdPermanentHp(o.bonus.hp);
      if (o.bonus.dmg) hdPermanentDmg(o.bonus.dmg);
    }
  } catch (err) { console.warn(err); }
  if (o.next) CINE.nextScene = o.next;
  hdSaveStory();
  if (o.jump !== undefined) {
    const target = CINE.labels[o.jump];
    hdCineEnter(target === undefined ? CINE.idx : target);
  } else {
    hdCineEnter(CINE.idx);
  }
}

function hdAdvance() {
  if (!CINE.active) return;
  if (CINE.choice) return;
  if (CINE.capOn) {
    CINE.capOn = false;
    cEl('cCap').classList.remove('show');
    hdCineEnter(CINE.idx);
    return;
  }
  if (CINE.typing) {
    CINE.shown = CINE.full.length;
    CINE.typing = false;
    cEl('cText').textContent = CINE.full;
    cEl('cNext').classList.add('show');
    return;
  }
  hdCineEnter(CINE.idx);
}

function hdSkipScene() {
  if (!CINE.active) return;
  if (!CINE.skipOk) { hdSfx('wrong'); return; }
  hdCineFinish();
}

function hdCineFinish() {
  const next = CINE.nextScene;
  const done = CINE.onDone;
  CINE.active = false;
  CINE.nextScene = null;
  CINE.onDone = null;
  cEl('cine').classList.add('h');
  cEl('cChoices').innerHTML = '';
  if (CINE.ovWasOpen) ov.classList.remove('h');
  mode = CINE.prevMode;
  if (next) hdPlayScene(next, done);
  else if (done) { try { done(); } catch (err) { console.warn(err); } }
}

function hdCineKey(e) {
  if (!CINE.active) return false;
  const k = (e.key || '').toLowerCase();
  if (k === 'escape') { e.preventDefault(); hdSkipScene(); return true; }
  if (k === ' ' || k === 'enter') { e.preventDefault(); if (CINE.choice) hdChoose(CINE.choiceSel); else hdAdvance(); return true; }
  if (CINE.choice) {
    if (k === 'arrowup' || k === 'w') {
      e.preventDefault();
      CINE.choiceSel = (CINE.choiceSel + CINE.choice.length - 1) % CINE.choice.length;
      hdChoiceHighlight(); return true;
    }
    if (k === 'arrowdown' || k === 's') {
      e.preventDefault();
      CINE.choiceSel = (CINE.choiceSel + 1) % CINE.choice.length;
      hdChoiceHighlight(); return true;
    }
    if (k >= '1' && k <= '9') {
      const n = +k - 1;
      if (n < CINE.choice.length) { e.preventDefault(); hdChoose(n); return true; }
    }
  }
  return false;
}

function hdChoiceHighlight() {
  const bs = [...cEl('cChoices').querySelectorAll('.cbtn')];
  bs.forEach((b, j) => b.classList.toggle('on', j === CINE.choiceSel));
}

/* --------------------------- cutscene UI wiring --------------------------- */
cEl('cSkip').addEventListener('click', e => { e.stopPropagation(); hdSkipScene(); });
cEl('cine').addEventListener('click', e => {
  if (e.target.closest && (e.target.closest('.cbtn') || e.target.closest('.cSkip'))) return;
  hdAdvance();
});
addEventListener('keydown', e => {
  if (!CINE.active) return;
  if (hdCineKey(e)) { e.stopPropagation(); }
}, true);

/* ------------------------------ scene helpers ------------------------------ */
const HD_L = (who, text, extra) => Object.assign({ who: who, text: text }, extra || {});
const HD_CAP = (cap, sub, auto, kicker) => ({ cap: cap, sub: sub || '', auto: auto || 0, kicker: kicker || '' });
const HD_OPT = (t, extra) => Object.assign({ t: t }, extra || {});
const HD_CH = (...opts) => ({ choice: opts });

</script>
<script>
/* ===== story_cine.js ===== */
/* =====================================================================
   CINEMATIC RENDERER
   ===================================================================== */
const HDCC = document.getElementById('cc');
const hdX = HDCC.getContext('2d');
HDCC.width = W; HDCC.height = H;
hdX.imageSmoothingEnabled = false;
const hdCFlash = document.getElementById('cFlash');

function hdGrad(y0, y1, c0, c1) {
  const g = hdX.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  return g;
}

function hdTile(name, x, y, sc, alpha) {
  const a = A[name]; if (!a) return;
  sc = sc || 1;
  hdX.globalAlpha = alpha === undefined ? 1 : alpha;
  hdX.drawImage(img, a[0], a[1], a[2], a[3], Math.round(x), Math.round(y), a[2] * sc, a[3] * sc);
  hdX.globalAlpha = 1;
}

function hdSpriteC(name, cx, by, sc, fl, alpha, glow) {
  const a = A[name]; if (!a) return;
  sc = sc || 1;
  const w = a[2] * sc, h = a[3] * sc;
  hdX.save();
  hdX.globalAlpha = alpha === undefined ? 1 : alpha;
  if (glow) { hdX.shadowColor = glow; hdX.shadowBlur = 8 * sc; }
  if (fl) {
    hdX.translate(cx + w / 2, by - h);
    hdX.scale(-1, 1);
    hdX.drawImage(img, a[0], a[1], a[2], a[3], -w / 2, 0, w, h);
  } else {
    hdX.drawImage(img, a[0], a[1], a[2], a[3], cx - w / 2, by - h, w, h);
  }
  hdX.restore();
}

function hdStar(x, y, r, c, a) {
  hdX.globalAlpha = a;
  hdX.fillStyle = c || '#fff';
  hdX.fillRect(Math.round(x), Math.round(y), r, r);
  hdX.globalAlpha = 1;
}

function hdMoon(x, y, r) {
  const g = hdX.createRadialGradient(x, y, 2, x, y, r * 2.4);
  g.addColorStop(0, 'rgba(242,230,201,.55)');
  g.addColorStop(.35, 'rgba(224,164,58,.14)');
  g.addColorStop(1, 'rgba(224,164,58,0)');
  hdX.fillStyle = g;
  hdX.fillRect(x - r * 2.5, y - r * 2.5, r * 5, r * 5);
  hdX.fillStyle = '#e8dcc0';
  hdX.beginPath(); hdX.arc(x, y, r, 0, 6.283); hdX.fill();
  hdX.fillStyle = 'rgba(160,140,110,.35)';
  hdX.beginPath(); hdX.arc(x - r * .3, y - r * .2, r * .18, 0, 6.283); hdX.arc(x + r * .24, y + r * .26, r * .12, 0, 6.283); hdX.fill();
}

function hdTorch(x, y, t) {
  const f = 1 + Math.sin(t * 9 + x) * .28 + Math.sin(t * 17 + x * 2) * .12;
  const g = hdX.createRadialGradient(x, y, 2, x, y, 46 * f);
  g.addColorStop(0, 'rgba(255,190,90,.52)');
  g.addColorStop(.4, 'rgba(255,120,40,.16)');
  g.addColorStop(1, 'rgba(255,90,20,0)');
  hdX.fillStyle = g; hdX.fillRect(x - 50, y - 50, 100, 100);
  hdX.fillStyle = '#ffca6a';
  hdX.beginPath(); hdX.ellipse(x, y + Math.sin(t * 12 + x) * 1.5, 2.6 * f, 5.2 * f, 0, 0, 6.283); hdX.fill();
  hdX.fillStyle = '#fff3cc';
  hdX.beginPath(); hdX.ellipse(x, y + 1, 1.2 * f, 2.6 * f, 0, 0, 6.283); hdX.fill();
}

function hdFire(x, y, t, sc) {
  sc = sc || 1;
  const fl = (n) => Math.sin(t * (6 + n * 1.7) + n * 2.1);
  for (let i = 0; i < 3; i++) {
    const w = (13 - i * 3.4) * sc, h = (20 - i * 4) * sc;
    const ox = fl(i + 1) * 2.2 * sc, oy = fl(i + 3) * 1.4 * sc;
    hdX.fillStyle = i === 0 ? 'rgba(190,50,20,.85)' : i === 1 ? 'rgba(255,140,40,.9)' : 'rgba(255,220,120,.95)';
    hdX.beginPath();
    hdX.moveTo(x - w / 2 + ox, y);
    hdX.quadraticCurveTo(x - w * .7 + ox, y - h * .55, x + ox * .4, y - h + oy);
    hdX.quadraticCurveTo(x + w * .65 + ox, y - h * .5, x + w / 2 + ox, y);
    hdX.closePath(); hdX.fill();
  }
  const g = hdX.createRadialGradient(x, y - 8 * sc, 2, x, y - 4 * sc, 60 * sc);
  g.addColorStop(0, 'rgba(255,170,70,.28)');
  g.addColorStop(1, 'rgba(255,120,40,0)');
  hdX.fillStyle = g; hdX.fillRect(x - 66 * sc, y - 70 * sc, 132 * sc, 100 * sc);
}

function hdWisp(x, y, t, sc, col) {
  sc = sc || 1;
  col = col || '#9fd3ff';
  const bob = Math.sin(t * 2.2) * 2.2 * sc;
  const r = 4.2 * sc;
  const g = hdX.createRadialGradient(x, y + bob, 0, x, y + bob, 18 * sc);
  g.addColorStop(0, 'rgba(190,235,255,.75)');
  g.addColorStop(.22, 'rgba(120,190,255,.35)');
  g.addColorStop(1, 'rgba(80,150,255,0)');
  hdX.fillStyle = g; hdX.fillRect(x - 20 * sc, y + bob - 20 * sc, 40 * sc, 40 * sc);
  hdX.fillStyle = col;
  hdX.beginPath(); hdX.arc(x, y + bob, r, 0, 6.283); hdX.fill();
  hdX.fillStyle = '#fff';
  hdX.beginPath(); hdX.arc(x - r * .18, y + bob - r * .2, r * .42, 0, 6.283); hdX.fill();
  for (let i = 0; i < 4; i++) {
    const a = t * (1.1 + i * .13) + i * 1.7;
    const rr = (8 + i * 3.5) * sc;
    hdStar(x + Math.cos(a) * rr, y + bob + Math.sin(a) * rr * .55, 1 * sc, col, .35 + .25 * Math.sin(t * 4 + i));
  }
}

  for (let i = 0; i < 4; i++) { hdX.beginPath(); hdX.ellipse(176, 124, 18 + i * 4, 44 + i * 6, .2, 0, 6.283); hdX.stroke(); }
  // suspended scholar
  hdSpriteC('wizzard_m_idle_anim_f' + (Math.floor(t * 3) % 4), 176, 168, 1.5, false, .55);
  // amber drips
  for (let i = 0; i < 10; i++) {
    const x = 146 + (i * 23) % 70, y = 60 + ((t * (4 + i % 3) + i * 13) % 108);
    hdX.globalAlpha = .5; hdX.fillStyle = '#d6a24a';

  }

}

function hdBgForge(t) {
  hdX.fillStyle = hdGrad(0, 240, '#160805', '#2a0f07'); hdX.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) {
    const x = i * 80;
    hdX.fillStyle = '#1c0d08'; hdX.fillRect(x, 0, 14, 180);
  }
  // anvil
  hdX.fillStyle = '#0a0606'; hdX.fillRect(230, 158, 54, 12); hdX.fillRect(248, 170, 18, 22); hdX.fillRect(240, 192, 34, 8);
  // forge
  hdX.fillStyle = '#0a0505'; hdX.fillRect(76, 130, 90, 62);
  hdX.fillStyle = '#2a0f06'; hdX.fillRect(84, 138, 74, 46);
  hdFire(121, 178, t, 1.3);
  // sparks
  for (let i = 0; i < 26; i++) {
    const x = 121 + Math.sin(t * 4 + i * 2.1) * (10 + (i % 6) * 9);
    const y = 180 - ((t * (20 + i % 12) + i * 13) % 130);
    hdStar(x, y, 1, i % 3 ? '#ffb347' : '#fff3cc', .3 + .35 * Math.sin(t * 5 + i));
  }
  hdTorch(300, 92, t);
  hdX.fillStyle = '#0b0808'; hdX.fillRect(0, 200, W, 40);
}

function hdBgDawn(t) {
  hdX.fillStyle = hdGrad(0, 200, '#1a1426', '#e0a43a'); hdX.fillRect(0, 0, W, H);
  const g = hdX.createRadialGradient(176, 190, 10, 176, 190, 220);
  g.addColorStop(0, 'rgba(255,236,180,.85)'); g.addColorStop(.35, 'rgba(255,180,80,.3)'); g.addColorStop(1, 'rgba(255,120,40,0)');
  hdX.fillStyle = g; hdX.fillRect(0, 0, W, H);
  hdX.fillStyle = '#2a1620';
  for (let i = 0; i < 8; i++) {
    const x = i * 52 - 16, w = 34, h = 22 + (i % 3) * 8;
    hdX.fillRect(x, 166 - h, w, h);
    hdX.beginPath(); hdX.moveTo(x - 4, 166 - h); hdX.lineTo(x + w / 2, 152 - h); hdX.lineTo(x + w + 4, 166 - h); hdX.closePath(); hdX.fill();
  }
  hdX.fillStyle = '#1a0f16';
  hdX.beginPath(); hdX.moveTo(0, 190); hdX.quadraticCurveTo(140, 172, 352, 186); hdX.lineTo(352, 240); hdX.lineTo(0, 240); hdX.closePath(); hdX.fill();
  // rays
  hdX.globalAlpha = .09; hdX.fillStyle = '#fff3cc';
  for (let i = 0; i < 9; i++) { hdX.beginPath(); hdX.moveTo(176, 200); hdX.lineTo(176 + Math.cos(i * .7 + t * .05) * 260, 200 - Math.sin(i * .7 + t * .05) * 260); hdX.lineTo(176 + Math.cos(i * .7 + .2 + t * .05) * 260, 200 - Math.sin(i * .7 + .2 + t * .05) * 260); hdX.closePath(); hdX.fill(); }
  hdX.globalAlpha = 1;
  for (let i = 0; i < 20; i++) {
    const y = 220 - ((t * (4 + i % 5) + i * 29) % 180);
    hdStar((i * 61 + Math.sin(t + i) * 12) % W, y, 1, '#fff3cc', .15 + .25 * Math.sin(t * 2 + i));
  }
}

function hdBgAshes(t) {
  hdX.fillStyle = hdGrad(0, 240, '#16161a', '#2a2626'); hdX.fillRect(0, 0, W, H);
  hdX.fillStyle = 'rgba(200,200,200,.06)';
  hdX.beginPath(); hdX.arc(176, 100, 60, 0, 6.283); hdX.fill();
  hdX.fillStyle = '#0d0d10';
  for (let i = 0; i < 8; i++) { const x = i * 50 - 10, h = 18 + (i % 3) * 7; hdX.fillRect(x, 172 - h, 28, h); }
  hdX.fillStyle = '#08080a'; hdX.fillRect(0, 196, W, 44);
  for (let i = 0; i < 40; i++) {
    const x = (i * 59 + t * (5 + i % 5)) % 400 - 20;
    const y = (i * 37 + t * 8) % 250;
    hdStar(x, y, 1, i % 4 ? '#9a9494' : '#c8c0b8', .1 + .22 * (0.5 + 0.5 * Math.sin(t + i)));
  }
  // lone lantern
  hdX.fillStyle = '#3a3430'; hdX.fillRect(250, 184, 8, 10);
  hdX.fillStyle = 'rgba(255,180,70,.25)'; hdX.beginPath(); hdX.arc(254, 182, 14, 0, 6.283); hdX.fill();
  hdX.fillStyle = '#ffb347'; hdX.fillRect(252, 179, 4, 5);
}

function hdBgCrown(t) {
  hdBgThrone(t, true);
  hdX.fillStyle = 'rgba(120,20,40,.12)'; hdX.fillRect(0, 0, W, H);
  // crown
  hdX.save(); hdX.translate(176, 66);
  hdX.fillStyle = '#e0a43a';
  hdX.beginPath(); hdX.moveTo(-16, 6); hdX.lineTo(-20, -10); hdX.lineTo(-8, -2); hdX.lineTo(0, -16); hdX.lineTo(8, -2); hdX.lineTo(20, -10); hdX.lineTo(16, 6); hdX.closePath(); hdX.fill();
  hdX.fillStyle = '#c78bff'; hdX.fillRect(-2, -10, 4, 4);
  hdX.restore();
  hdX.fillStyle = 'rgba(255,20,40,' + (.05 + .03 * Math.sin(t * 3)) + ')'; hdX.fillRect(0, 0, W, H);
}

function hdBgForgotten(t) {
  hdX.fillStyle = hdGrad(0, 240, '#cfd8e6', '#e8e4da'); hdX.fillRect(0, 0, W, H);
  const g = hdX.createRadialGradient(176, 120, 20, 176, 120, 220);
  g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(220,225,235,.2)');
  hdX.fillStyle = g; hdX.fillRect(0, 0, W, H);
  // fading silhouettes
  hdX.globalAlpha = .13; hdX.fillStyle = '#5a5a6a';
  hdSpriteC(hdHeroKey() + '_idle_anim_f' + (Math.floor(t * 3) % 4), 176, 186, 1.7, false, .2);
  hdSpriteC('wizzard_f_idle_anim_f' + (Math.floor(t * 3) % 4), 208, 186, 1.4, true, .1);
  hdX.globalAlpha = 1;
  // lantern on ground
  hdX.fillStyle = '#6f6a64'; hdX.fillRect(168, 192, 12, 14);
  hdX.fillStyle = '#d8cde6'; hdX.fillRect(170, 188, 8, 6);
  for (let i = 0; i < 26; i++) {
    const x = (i * 67 + t * (5 + i % 4)) % 400 - 20;
    const y = 200 - ((t * (6 + i % 6) + i * 17) % 190);
    hdStar(x, y, 1, i % 3 ? '#ffffff' : '#c78bff', .18 + .3 * (0.5 + 0.5 * Math.sin(t * 2 + i)));
  }
}

function hdDrawBg(name, t) {
  switch (name) {
    case 'village': hdBgVillage(t); break;
    case 'camp': hdBgCamp(t); break;
    case 'crypt': hdBgCrypt(t); break;
    case 'depths': hdBgDepths(t); break;
    case 'hall': hdBgHall(t); break;
    case 'throne': hdBgThrone(t); break;
    case 'mirror': hdBgMirror(t); break;
    case 'door': hdBgDoor(t); break;
    case 'resin': hdBgResin(t); break;
    case 'forge': hdBgForge(t); break;
    case 'dawn': hdBgDawn(t); break;
    case 'ashes': hdBgAshes(t); break;
    case 'crown': hdBgCrown(t); break;
    case 'forgotten': hdBgForgotten(t); break;
    default: hdBgVoid(t);
  }
}

/* ------------------------------ actors ------------------------------ */
function hdActorSprite(a, t) {
  const sc = a.sc || 1.8;
  const alpha = a.a === undefined ? 1 : a.a;
  const fl = !!a.fl;
  const glow = a.glow || null;
  const fr = Math.floor(t * (a.fast ? 9 : 5.5) + (a.ph || 0)) % 4;
  if (a.k === 'mara') {
    hdSpriteC('wizzard_f_idle_anim_f' + fr, a.x, a.y, sc * .8, fl, alpha * .22, '#6ec1ff');
    hdWisp(a.x, a.y - 28 * sc * .55, t, sc * .8, '#9fd3ff');
    return;
  }
  if (a.k === 'hero') {
    hdSpriteC(hdHeroKey() + '_' + (a.run ? 'run' : 'idle') + '_anim_f' + fr, a.x, a.y, sc, fl, alpha, glow);
    return;
  }
  if (a.k === 'orin') { hdSpriteC('wizzard_m_idle_anim_f' + fr, a.x, a.y, sc, fl, alpha, '#ffd98a'); return; }
  if (a.k === 'witch') { hdSpriteC('wizzard_f_idle_anim_f' + fr, a.x, a.y, sc, fl, alpha, '#ff5a3c'); return; }
  if (a.k === 'gk') { hdSpriteC('ogre_idle_anim_f' + fr, a.x, a.y, sc * 1.15, fl, alpha, '#c7a17a'); return; }
  if (a.k === 'saint') { hdSpriteC('big_zombie_idle_anim_f' + fr, a.x, a.y, sc * 1.15, fl, alpha, '#9ee6ae'); return; }
  if (a.k === 'king') { hdSpriteC('big_demon_idle_anim_f' + fr, a.x, a.y, sc * 1.15, fl, alpha, '#c78bff'); return; }
  if (a.k === 'doc') { hdSpriteC('doc_idle_anim_f' + fr, a.x, a.y, sc, fl, alpha, glow); return; }
  if (a.spr) { hdSpriteC(a.spr + (a.anim ? '_anim_f' + fr : ''), a.x, a.y, sc, fl, alpha, glow); }
}

function hdDrawActors(t) {
  for (const a of CINE.actors) {
    if (!a) continue;
    if (a.k === 'king' && a.rise !== false) {
      hdX.save(); hdX.globalAlpha = .18; hdX.fillStyle = '#c78bff';
      hdX.beginPath(); hdX.ellipse(a.x, a.y + 2, 28, 5, 0, 0, 6.283); hdX.fill(); hdX.restore();
    }
    hdActorSprite(a, t);
    if (a.k === 'king') hdWisp(a.x + 26, a.y - 74, t * .6, .7, '#c78bff');
  }
}

/* ------------------------------ particles ------------------------------ */
function hdEmit(fx, t) {
  const rnd = Math.random;
  if (fx === 'ash') {
    for (let i = 0; i < 2; i++) CINE.parts.push({ k: 'ash', x: rnd() * W, y: -6, vx: -8 - rnd() * 14, vy: 10 + rnd() * 16, s: 1 + (rnd() < .3 ? 1 : 0), l: 1, c: rnd() < .3 ? '#ffb347' : '#b9a9c9' });
  } else if (fx === 'embers') {
    for (let i = 0; i < 2; i++) CINE.parts.push({ k: 'ember', x: 120 + rnd() * 120, y: 210 + rnd() * 20, vx: (rnd() - .5) * 14, vy: -18 - rnd() * 26, s: 1 + (rnd() < .4 ? 1 : 0), l: 1, c: rnd() < .4 ? '#ffd98a' : '#ff8a3c' });
  } else if (fx === 'fog') {
    if (rnd() < .09) CINE.parts.push({ k: 'fog', x: rnd() * W, y: 80 + rnd() * 130, vx: 6 + rnd() * 10, vy: 0, s: 60 + rnd() * 80, l: 1, c: 'rgba(180,170,200,.045)' });
  } else if (fx === 'rain') {
    for (let i = 0; i < 3; i++) CINE.parts.push({ k: 'rain', x: rnd() * (W + 30), y: -8, vx: -26, vy: 150 + rnd() * 90, s: 6 + rnd() * 10, l: 1, c: 'rgba(140,190,220,.25)' });
  } else if (fx === 'spores') {
    for (let i = 0; i < 2; i++) CINE.parts.push({ k: 'spore', x: rnd() * W, y: 40 + rnd() * 180, vx: (rnd() - .5) * 8, vy: -3 - rnd() * 8, s: 1 + (rnd() < .25 ? 1 : 0), l: 1, c: rnd() < .5 ? '#7dff9a' : '#9ee6ae' });
  } else if (fx === 'void') {
    if (rnd() < .2) CINE.parts.push({ k: 'shard', x: rnd() * W, y: H + 8, vx: (rnd() - .5) * 10, vy: -10 - rnd() * 18, s: 1 + rnd() * 2, l: 1, c: rnd() < .5 ? '#c78bff' : '#6ec1ff' });
  } else if (fx === 'dust') {
    if (rnd() < .4) CINE.parts.push({ k: 'dust', x: rnd() * W, y: 20 + rnd() * 200, vx: (rnd() - .5) * 5, vy: -2 - rnd() * 4, s: 1, l: 1, c: '#d8cde6' });
  } else if (fx === 'snow') {
    for (let i = 0; i < 2; i++) CINE.parts.push({ k: 'snow', x: rnd() * W, y: -4, vx: (rnd() - .5) * 10, vy: 8 + rnd() * 14, s: 1 + (rnd() < .3 ? 1 : 0), l: 1, c: '#fff' });
  }
}

function hdUpdateParts(dt, t) {
  if (CINE.fx) hdEmit(CINE.fx, t);
  for (const p of CINE.parts) {
    p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt;
    if (p.k === 'ash' || p.k === 'snow') p.x += Math.sin(t * 1.7 + p.y * .04) * 7 * dt;
    if (p.k === 'ember') p.x += Math.sin(t * 2.3 + p.y * .05) * 5 * dt;
    if (p.k === 'shard') p.y -= 2 * dt;
  }
  CINE.parts = CINE.parts.filter(p => p.y > -20 && p.y < H + 20 && p.x > -30 && p.x < W + 30);
  if (CINE.parts.length > 110) CINE.parts.splice(0, CINE.parts.length - 110);
}

function hdDrawParts() {
  for (const p of CINE.parts) {
    if (p.k === 'rain') {
      hdX.strokeStyle = p.c; hdX.lineWidth = 1;
      hdX.beginPath(); hdX.moveTo(p.x, p.y); hdX.lineTo(p.x + 2, p.y + p.s); hdX.stroke();
    } else if (p.k === 'fog') {
      hdX.fillStyle = p.c;
      hdX.beginPath(); hdX.ellipse(p.x, p.y, p.s, p.s * .22, 0, 0, 6.283); hdX.fill();
    } else if (p.k === 'shard') {
      hdX.fillStyle = p.c; hdX.globalAlpha = .45;
      hdX.save(); hdX.translate(p.x, p.y); hdX.rotate(p.y * .02);
      hdX.beginPath(); hdX.moveTo(0, -p.s * 2); hdX.lineTo(p.s, 0); hdX.lineTo(0, p.s * 2); hdX.lineTo(-p.s, 0); hdX.closePath(); hdX.fill();
      hdX.restore(); hdX.globalAlpha = 1;
    } else {
      hdStar(p.x, p.y, p.s, p.c, p.k === 'dust' ? .25 : .55);
    }
  }
}

/* ------------------------------ frame ------------------------------ */
function hdCineFrame() {
  if (!CINE.active) { CINE.last = 0; return; }
  const nowMs = performance.now();
  let dt = CINE.last ? (nowMs - CINE.last) / 1000 : 1 / 60;
  CINE.last = nowMs;
  dt = Math.max(0, Math.min(.05, dt));
  CINE.t += dt;
  if (CINE.shake > 0) CINE.shake = Math.max(0, CINE.shake - dt * 1.6);
  if (CINE.flash > 0) CINE.flash = Math.max(0, CINE.flash - dt * 2.2);
  hdCFlash.style.opacity = CINE.flash.toFixed(3);
  if (CINE.typing) {
    CINE.revealT += dt;
    const n = Math.floor(CINE.revealT * 56);
    if (n !== CINE.shown) {
      CINE.shown = Math.min(CINE.full.length, n);
      cEl('cText').textContent = CINE.full.slice(0, CINE.shown);
      if (CINE.shown >= CINE.full.length) {
        CINE.typing = false;
        cEl('cNext').classList.add('show');
      }
    }
  }
  if (CINE.capOn && CINE.capAuto > 0) {
    CINE.capT += dt;
    if (CINE.capT >= CINE.capAuto) { hdAdvance(); return; }
  }
  hdDrawCine(dt);
}

function hdDrawCine(dt) {
  const t = CINE.t;
  hdX.setTransform(1, 0, 0, 1, 0, 0);
  hdX.globalAlpha = 1;
  hdX.clearRect(0, 0, W, H);
  const shake = CINE.shake > 0 ? (Math.random() - .5) * CINE.shake * 10 : 0;
  const camX = Math.sin(t * .18) * 3;
  const camY = Math.cos(t * .13) * 2;
  hdX.save();
  hdX.translate(camX + shake, camY);
  hdDrawBg(CINE.bg, t);
  hdUpdateParts(dt, t);
  hdDrawActors(t);
  hdDrawParts();
  hdX.restore();
  // cinematic bars + bottom gradient
  hdX.fillStyle = 'rgba(0,0,0,.92)';
  hdX.fillRect(0, 0, W, 9);
  hdX.fillRect(0, H - 22, W, 22);
  const g = hdX.createLinearGradient(0, 138, 0, 210);
  g.addColorStop(0, 'rgba(4,2,8,0)'); g.addColorStop(1, 'rgba(4,2,8,.72)');
  hdX.fillStyle = g; hdX.fillRect(0, 138, W, 72);
  hdX.fillStyle = 'rgba(224,164,58,.18)';
  hdX.fillRect(0, 9, W, 1);
  hdX.fillRect(0, H - 22, W, 1);
}

SCENES.intro = {

    { if: () => STORY.flags.motive === 'village', who: 'MARA', text: 'Then we will bring them a dawn, or we will die trying.' },
    { if: () => STORY.flags.motive === 'sister', who: 'MARA', text: 'Ah. The one it took. I will help you remember her. That is what the lantern is for.' },
    { if: () => STORY.flags.motive === 'truth', who: 'MARA', text: 'Truth is a blade with two edges. Carry it carefully.' },
    HD_L('MARA', 'Below us is Veyra. A city that drowned in a single night. Its memories are still down there, rotting.'),

};

/* ------------------------------ CHAPTER II ------------------------------ */
SCENES.ch2_intro = {

  actors: [
    { k: 'hero', x: 120, y: 204, sc: 2.2 },
    { k: 'mara', x: 176, y: 190, sc: 1.5 }
  ],
  lines: [
    HD_CAP('CHAPTER II', 'THE ROTTING SAINT', 3.4, 'THE GARDEN DISTRICT'),
    HD_L('MARA', 'This was the Garden District. The water brought rot, and the rot brought flowers.'),
    HD_L('NARRATOR', 'Something is writing in the silt ahead. It has been writing for a long time.'),
    HD_L('MARA', 'The Gravekeeper spoke of a scholar. If anyone is still keeping notes down here, it will be him.'),
    HD_L('YOU', 'Notes? In this place?'),
    HD_L('MARA', 'Memory is a kind of writing. The Hollow is a kind of erasing. Perhaps he thought he could outwrite it.'),
    HD_L('MARA', 'Stay close. The flowers are listening.')

};

/* ------------------------------ CHAPTER III ------------------------------ */
SCENES.ch3_intro = {
  bg: 'hall', fx: 'embers',
  actors: [
    { k: 'hero', x: 110, y: 204, sc: 2.2 },
    { k: 'mara', x: 158, y: 190, sc: 1.4 }
  ],
  lines: [
    HD_CAP('CHAPTER III', 'THE EMBER CROWN', 3.4, 'THE FORGE OF VEYRA'),
    HD_L('NARRATOR', 'The Ember Halls. Every flame here is a memory burning down to its last thought.'),
    { if: () => hdFlag('orin'), who: 'ORIN', text: 'Aurel forged the crown in this hall. His sister lit the furnace. The records are... somewhat singed.' },
    { if: () => hdFlag('orin'), text: 'He was not trying to become a god. He was trying to build a vessel large enough to hold a city.' },
    HD_L('MARA', 'The furnace is still warm. That means something down here is still remembering.'),
    { actors: [{ k: 'hero', x: 110, y: 204, sc: 2.2 }, { k: 'mara', x: 158, y: 190, sc: 1.4 }, { k: 'witch', x: 248, y: 198, sc: 1.9 }] },
    HD_L('EMBER WITCH', 'Warm? It is furious. There is a difference, little candle.'),
    HD_L('EMBER WITCH', 'You smell of the surface. Of rain. Of people who still believe the sun is a promise.'),
