name: Profile (host harness)

# Temporary: profiles the same runtime the Vita build uses so the rasterizer
# hotspots are visible before optimising them. Not part of the release flow.
on:
  workflow_dispatch:
  push:
    branches: [ perf ]

jobs:
  current:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4

      - name: Time (release flags)
        run: |
          set -eux
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3; }
          make -C vita clean
          make -C vita host
          mkdir -p shots
          KEYS="6:ArrowDown,8:ArrowDownUp,10:ArrowDown,12:ArrowDownUp,16:Enter,18:EnterUp,30:Enter,32:EnterUp,40: ,42:SpaceUp,60: ,62:SpaceUp,80: ,82:SpaceUp,100: ,102:SpaceUp"
          for mode in "" "--present"; do
            for i in 1 2 3; do
              start=$(date +%s%N)
              ./vita/build/hollowdeep_host --frames 180 --out shots --shots 6,30,60,120,179 --keys "$KEYS" $mode
              end=$(date +%s%N)
              echo "TOTAL[$mode]: $(( (end - start) / 1000000 )) ms for 180 frames"
            done
          done
          python3 tools/ppm2png.py 'shots/*.ppm'

      - uses: actions/upload-artifact@v4
        with:
          name: shots-current
          path: shots/*.png

  baseline:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Time baseline (release flags)
        run: |
          set -eux
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3; }
          # same harness (it only reads the runtime, it is not shipped)
          git config --global --add safe.directory "$PWD"
          git fetch --depth=1 origin perf
          git checkout FETCH_HEAD -- vita/source/main_host.c
          make -C vita clean
          make -C vita host
          mkdir -p shots
          KEYS="6:ArrowDown,8:ArrowDownUp,10:ArrowDown,12:ArrowDownUp,16:Enter,18:EnterUp,30:Enter,32:EnterUp,40: ,42:SpaceUp,60: ,62:SpaceUp,80: ,82:SpaceUp,100: ,102:SpaceUp"
          for mode in "" "--present"; do
            for i in 1 2 3; do
              start=$(date +%s%N)
              ./vita/build/hollowdeep_host --frames 180 --out shots --shots 179 --keys "$KEYS" $mode
              end=$(date +%s%N)
              echo "BASELINE[$mode]: $(( (end - start) / 1000000 )) ms for 180 frames"
            done
          done

  vpk:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4

      - name: Build VPK
        run: |
          set -eux
          export PATH="$VITASDK/bin:$PATH"
          make -C vita vpk
          ls -l vita/build/Hollowdeep.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: vpk
          path: vita/build/Hollowdeep.vpk
